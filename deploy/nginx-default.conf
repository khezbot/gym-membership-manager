# /etc/nginx/sites-available/default on the EC2 instance
server {
    listen 80;
    server_name _;

    # API -> Express backend (pm2 "backend", port 5001). Port 5001 is NOT opened publicly.
    location /api/ {
        proxy_pass http://localhost:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else -> React build served by pm2 "frontend" on port 3000
    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
